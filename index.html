<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0c1b18">
<title>Quran Revision</title>
<style>
  :root{
    /* Grün (Standard) */
    --bg:#0c1b18; --surface:#11302a; --surface-2:#16423a; --line:#1f5246;
    --accent:#2fb59a; --accent-soft:#7fd9c6; --on-accent:var(--on-accent);
    --sand:#e8dcc3; --sand-dim:#bcae93; --gold:#d9b14e; --red:#e07a6b;
    --text:#eef5f1; --text-dim:#8fb3a8;
    --radius:16px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  body[data-theme="violett"]{
    --bg:#150f1f; --surface:#221833; --surface-2:#2e2145; --line:#3f2f5c;
    --accent:#a06ee0; --accent-soft:#c9a6f2; --on-accent:#1a0f2b;
    --sand:#e6dcf0; --sand-dim:#b4a3c9; --gold:#d9b14e; --red:#e07a6b;
    --text:#f1ecf7; --text-dim:#a494bd;
  }
  body[data-theme="blau"]{
    --bg:#0b1622; --surface:#122436; --surface-2:#183247; --line:#234563;
    --accent:#3f9fe0; --accent-soft:#8fcbf0; --on-accent:#04202f;
    --sand:#dbe6f0; --sand-dim:#9fb3c7; --gold:#d9b14e; --red:#e07a6b;
    --text:#eaf2f9; --text-dim:#8ba7c2;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);-webkit-font-smoothing:antialiased;}
  .wrap{max-width:560px;margin:0 auto;padding:20px 16px 60px;}

  header{margin-bottom:16px;}
  .eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--sand-dim);font-weight:600;margin-bottom:6px;}
  h1{font-size:26px;font-weight:700;letter-spacing:-.01em;line-height:1.1;}
  .day-head{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap;}
  .day-badge{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:4px 11px;border-radius:99px;}
  .day-badge.today{background:var(--accent);color:var(--on-accent);}
  .day-badge.other{background:var(--surface-2);color:var(--sand-dim);border:1px solid var(--line);}
  .jump-today{background:transparent;border:1px solid var(--line);color:var(--accent-soft);font:inherit;font-size:12px;font-weight:600;padding:4px 11px;border-radius:99px;cursor:pointer;}
  .dates{margin-top:10px;display:flex;flex-direction:column;gap:2px;}
  .date-greg{font-size:14px;color:var(--text-dim);}
  .date-hijri{font-size:15px;color:var(--gold);font-weight:600;direction:rtl;text-align:left;}
  .date-hijri .latin{direction:ltr;color:var(--sand-dim);font-weight:400;}

  /* Calendar */
  .cal{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:16px;}
  .cal-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;}
  .cal-title{font-size:15px;font-weight:700;text-align:center;flex:1;min-width:0;}
  .cal-title .htitle{color:var(--gold);display:block;}
  .cal-title .gtitle{color:var(--text-dim);font-size:12px;font-weight:400;display:block;margin-top:1px;}
  .cal-nav{background:var(--surface-2);border:1px solid var(--line);color:var(--text);width:34px;height:34px;border-radius:9px;font-size:20px;line-height:1;cursor:pointer;flex-shrink:0;}
  .cal-nav:disabled{opacity:.25;}
  .cal-modes{display:flex;gap:6px;margin-bottom:12px;}
  .cal-modes button{flex:1;background:transparent;border:1px solid var(--line);color:var(--text-dim);font:inherit;font-size:13px;font-weight:600;padding:8px;border-radius:9px;cursor:pointer;}
  .cal-modes button.active{background:var(--surface-2);border-color:var(--accent);color:var(--text);}

  .cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;width:100%;}
  .cal-dow{text-align:center;font-size:10px;color:var(--text-dim);font-weight:600;padding:2px 0 4px;min-width:0;}
  .cal-cell{min-width:0;min-height:52px;border-radius:9px;border:1px solid transparent;display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px 2px;
    cursor:pointer;background:var(--bg);overflow:hidden;}
  .cal-cell.empty{background:transparent;cursor:default;}
  .cal-cell .gtag{font-size:7px;font-weight:700;color:var(--sand-dim);text-transform:uppercase;line-height:1;height:8px;overflow:hidden;max-width:100%;}
  .cal-cell .hd{font-size:13px;font-weight:600;line-height:1;}
  .cal-cell .gd{font-size:8px;color:var(--text-dim);line-height:1;}
  .cal-cell .stat{width:5px;height:5px;border-radius:99px;margin-top:1px;background:transparent;}
  .cal-cell .stat.done{background:var(--accent);}
  .cal-cell .stat.partial{background:var(--gold);}
  .cal-cell.today{border-color:var(--accent);}
  .cal-cell.sel{background:var(--surface-2);border-color:var(--accent-soft);}
  .cal-cell.sel .hd{color:var(--accent-soft);}

  .wk{display:flex;flex-direction:column;gap:5px;}
  .wkrow{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);
    border-radius:11px;padding:10px 12px;cursor:pointer;}
  .wkrow.today{border-color:var(--accent);}
  .wkrow.sel{background:var(--surface-2);border-color:var(--accent-soft);}
  .wkday{width:74px;flex-shrink:0;display:flex;flex-direction:column;gap:1px;}
  .wkde{font-size:13px;font-weight:700;color:var(--text);}
  .wkrow.sel .wkde{color:var(--accent-soft);}
  .wkar{font-size:12px;color:var(--gold);direction:rtl;}
  .wkmid{flex:1;min-width:0;}
  .wkgroups{font-size:13px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .wknone{color:var(--text-dim);}
  .wkcustom{font-size:9px;font-weight:700;text-transform:uppercase;color:var(--gold);
    background:var(--surface);padding:1px 6px;border-radius:99px;margin-left:6px;}
  .wkdate{font-size:11px;color:var(--text-dim);margin-top:2px;}
  .wkstat{display:flex;align-items:center;gap:6px;flex-shrink:0;}
  .wsdot{width:8px;height:8px;border-radius:99px;background:var(--line);}
  .wsdot.done{background:var(--accent);}
  .wsdot.partial{background:var(--gold);}
  .wsnum{font-size:11px;font-weight:600;color:var(--text-dim);}
  .more-btn{width:100%;background:transparent;border:1px dashed var(--line);color:var(--text-dim);
    font:inherit;font-size:13px;font-weight:600;padding:11px;border-radius:11px;cursor:pointer;margin-top:6px;}

  .cal-legend{display:flex;gap:16px;justify-content:center;margin-top:12px;font-size:11px;color:var(--text-dim);}
  .cal-legend span{display:flex;align-items:center;gap:5px;}
  .cal-legend .lg{width:8px;height:8px;border-radius:99px;}
  .cal-legend .lg.done{background:var(--accent);}
  .cal-legend .lg.partial{background:var(--gold);}
  .cal-legend .lg.none{background:var(--line);}

  /* Missed */
  .missed{background:rgba(224,122,107,.07);border:1px solid rgba(224,122,107,.35);
    border-radius:var(--radius);padding:14px;margin-bottom:16px;}
  .missed h3{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--red);font-weight:700;margin-bottom:10px;
    display:flex;align-items:center;gap:8px;}
  .missed h3 .cnt{background:var(--red);color:#2a0d09;font-size:11px;padding:1px 8px;border-radius:99px;letter-spacing:0;}
  .mrow{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);
    border-radius:10px;padding:10px 12px;cursor:pointer;margin-bottom:6px;}
  .mrow .mdate{flex:1;min-width:0;}
  .mrow .mh{font-size:13px;font-weight:600;}
  .mrow .mg{font-size:11px;color:var(--text-dim);margin-top:1px;}
  .mrow .mp{font-size:11px;font-weight:700;color:var(--gold);flex-shrink:0;}

  /* Day card */
  .today-card{background:linear-gradient(160deg,var(--surface-2),var(--surface));
    border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px;}
  .today-top{margin-bottom:12px;}
  .today-label{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-dim);font-weight:600;margin-bottom:10px;}
  .today-label .wd-ar{color:var(--gold);direction:rtl;letter-spacing:0;font-size:14px;margin-right:4px;text-transform:none;}
  .wd-mark{color:var(--gold);margin-left:5px;font-size:15px;line-height:1;}
  .switch button.active .wd-mark{color:var(--on-accent);opacity:.7;}
  .undo-custom{background:transparent;border:1px solid var(--line);color:var(--accent-soft);
    font:inherit;font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;cursor:pointer;margin-left:auto;flex-shrink:0;}
  .switch{display:flex;gap:6px;flex-wrap:wrap;}
  .switch button{background:transparent;border:1px solid var(--line);color:var(--text-dim);
    font:inherit;font-size:13px;font-weight:600;padding:7px 14px;border-radius:99px;cursor:pointer;}
  .switch button.active{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
  .suggest-note{font-size:12px;color:var(--sand-dim);margin-top:10px;display:flex;align-items:center;gap:6px;}
  .dot{width:6px;height:6px;border-radius:99px;background:var(--gold);flex-shrink:0;}

  .progress-wrap{margin:14px 0 4px;}
  .progress-bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-soft));border-radius:99px;transition:width .3s;width:0;}
  .progress-text{font-size:12px;color:var(--text-dim);margin-top:7px;display:flex;justify-content:space-between;}

  .gblock{margin-top:18px;}
  .gblock-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:9px;gap:8px;}
  .gblock-name{font-size:16px;font-weight:700;}
  .gblock-meta{font-size:12px;color:var(--text-dim);}
  .edit-toggle{background:none;border:none;color:var(--accent-soft);font:inherit;font-size:12px;font-weight:600;cursor:pointer;padding:2px 0;}

  .surah-list{display:flex;flex-direction:column;gap:8px;}
  .surah{display:flex;flex-direction:column;align-items:stretch;background:var(--surface);
    border:1px solid var(--line);border-radius:12px;padding:12px 13px;}
  .surah.done{background:rgba(47,181,154,.08);border-color:rgba(47,181,154,.4);}
  .surah-main{display:flex;align-items:center;gap:11px;cursor:pointer;}
  .check{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;}
  .surah.done .check{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
  .check svg{width:14px;height:14px;opacity:0;}
  .surah.done .check svg{opacity:1;}
  .surah-info{flex:1;min-width:0;}
  .surah-name{font-size:15px;font-weight:600;}
  .surah.done .surah-name{color:var(--accent-soft);}
  .surah-num{font-size:12px;color:var(--text-dim);margin-top:1px;}
  .surah-num .mtag{color:var(--gold);font-weight:600;}
  .surah-ar{font-size:17px;color:var(--sand);direction:rtl;font-weight:500;flex-shrink:0;}
  .surah-tools{display:flex;gap:3px;flex-shrink:0;}
  .stool{background:var(--bg);border:1px solid var(--line);color:var(--text-dim);
    width:30px;height:30px;border-radius:8px;font-size:14px;line-height:1;cursor:pointer;}
  .stool:disabled{opacity:.25;}
  .stool.del{color:var(--red);}

  .method-row{display:flex;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid rgba(47,181,154,.2);}
  .mbtn{flex:1;background:var(--bg);border:1px solid var(--line);color:var(--text-dim);
    font:inherit;font-size:12px;font-weight:600;padding:8px 6px;border-radius:9px;cursor:pointer;}
  .mbtn.active{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}

  .add-btn{width:100%;background:transparent;border:1.5px dashed var(--line);color:var(--text-dim);
    font:inherit;font-size:14px;font-weight:600;padding:13px;border-radius:12px;cursor:pointer;margin-top:9px;}

  .section-head{margin:24px 0 12px;}
  .section-head h2{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-dim);font-weight:600;}
  .grow{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);
    border-radius:12px;padding:11px 13px;margin-bottom:7px;}
  .grow .ginfo{flex:1;min-width:0;}
  .grow .gname{font-size:15px;font-weight:600;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .grow .gactive{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    color:var(--accent);background:var(--surface-2);padding:2px 7px;border-radius:99px;}
  .grow .gdays{font-size:11px;color:var(--gold);margin-top:3px;}
  .grow .gprog{display:flex;align-items:center;gap:8px;margin-top:6px;}
  .grow .gbar{flex:1;height:5px;background:var(--bg);border-radius:99px;overflow:hidden;min-width:40px;}
  .grow .gbar-fill{height:100%;border-radius:99px;transition:width .3s;background:var(--line);}
  .grow .gbar-fill.done{background:var(--accent);}
  .grow .gbar-fill.partial{background:var(--gold);}
  .grow .gprog-txt{font-size:11px;font-weight:600;color:var(--text-dim);flex-shrink:0;}
  .grow .gprog-txt.done{color:var(--accent-soft);}
  .grow .gprog-txt.partial{color:var(--gold);}
  .add-group-btn{width:100%;background:transparent;border:1.5px dashed var(--line);color:var(--sand-dim);
    font:inherit;font-size:14px;font-weight:600;padding:13px;border-radius:12px;cursor:pointer;margin-top:4px;}

  .empty{text-align:center;color:var(--text-dim);font-size:13px;padding:18px 10px;line-height:1.5;
    border:1px dashed var(--line);border-radius:12px;}
  .theme-row{display:flex;gap:8px;}
  .theme-row button{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);
    color:var(--text-dim);font:inherit;font-size:13px;font-weight:600;padding:12px 6px;border-radius:11px;
    cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:.15s;}
  .theme-row button.active{border-color:var(--accent);color:var(--text);background:var(--surface-2);}
  .tdot{width:12px;height:12px;border-radius:99px;flex-shrink:0;}

  .reset-row{margin-top:26px;text-align:center;}
  .reset-row button{background:none;border:none;color:var(--text-dim);font:inherit;font-size:13px;cursor:pointer;opacity:.6;}

  /* Modal */
  .modal-bg{position:fixed;inset:0;background:rgba(4,12,10,.72);backdrop-filter:blur(4px);
    display:none;align-items:flex-end;justify-content:center;z-index:50;overflow-y:auto;}
  .modal-bg.open{display:flex;}
  .modal{background:var(--surface);border:1px solid var(--line);border-radius:20px 20px 0 0;
    width:100%;max-width:560px;padding:22px 18px calc(30px + env(safe-area-inset-bottom));
    animation:slideUp .22s ease;max-height:92vh;overflow-y:auto;}
  @keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
  .modal h3{font-size:18px;margin-bottom:16px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;font-weight:600;}
  .field input,.field select{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);
    font:inherit;font-size:15px;padding:13px;border-radius:11px;}
  .field input:focus,.field select:focus{outline:none;border-color:var(--accent);}
  .seg{display:flex;gap:6px;}
  .seg button{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);color:var(--text-dim);
    font:inherit;font-size:13px;font-weight:600;padding:11px 4px;border-radius:10px;cursor:pointer;}
  .seg button.active{background:var(--surface-2);border-color:var(--accent);color:var(--text);}
  .row2{display:flex;gap:10px;}
  .row2 .field{flex:1;}
  .hint{font-size:11px;color:var(--sand-dim);margin-top:5px;line-height:1.4;}
  .hint.warn{color:var(--red);}
  .modal-actions{display:flex;gap:10px;margin-top:6px;}
  .btn{flex:1;font:inherit;font-size:15px;font-weight:700;padding:14px;border-radius:12px;cursor:pointer;border:none;}
  .btn-primary{background:var(--accent);color:var(--on-accent);}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--text-dim);}
  .btn-danger{background:transparent;border:1px solid rgba(224,122,107,.5);color:var(--red);}

  /* Mehrfachauswahl */
  .range-row{display:flex;align-items:center;gap:8px;}
  .range-row select{flex:1;min-width:0;}
  .range-sep{font-size:13px;color:var(--text-dim);flex-shrink:0;}
  .range-apply{width:100%;margin-top:8px;background:var(--surface-2);border:1px solid var(--accent);
    color:var(--accent-soft);font:inherit;font-size:13px;font-weight:600;padding:10px;border-radius:9px;cursor:pointer;}
  .multi-list{max-height:230px;overflow-y:auto;border:1px solid var(--line);border-radius:11px;
    margin-top:8px;background:var(--bg);-webkit-overflow-scrolling:touch;}
  .mitem{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid rgba(31,82,70,.5);cursor:pointer;}
  .mitem:last-child{border-bottom:none;}
  .mitem.on{background:rgba(47,181,154,.1);}
  .mbox{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;}
  .mitem.on .mbox{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
  .mbox svg{width:12px;height:12px;opacity:0;}
  .mitem.on .mbox svg{opacity:1;}
  .mitem .mname{flex:1;min-width:0;font-size:14px;}
  .mitem .msub{display:block;font-size:10px;color:var(--text-dim);margin-top:1px;font-weight:400;}
  .mitem.on .mname{color:var(--accent-soft);font-weight:600;}
  .mitem .mar{font-size:15px;color:var(--sand);direction:rtl;flex-shrink:0;}
  .mitem .mord{font-size:10px;font-weight:700;color:var(--accent);background:var(--surface-2);
    padding:2px 7px;border-radius:99px;flex-shrink:0;}
  .multi-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;}
  .clear-sel{background:none;border:none;color:var(--text-dim);font:inherit;font-size:12px;
    cursor:pointer;text-decoration:underline;flex-shrink:0;}

  .wd-pick{display:flex;gap:4px;}
  .wd-pick button{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);color:var(--text-dim);
    font:inherit;font-size:11px;font-weight:700;padding:10px 2px;border-radius:9px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:3px;}
  .wd-pick button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
  .wd-pick .wpar{font-size:9px;opacity:.75;direction:rtl;font-weight:400;}

  /* Fokus */
  .focus-box{background:rgba(217,177,78,.07);border:1px solid rgba(217,177,78,.35);
    border-radius:var(--radius);padding:14px;margin-bottom:16px;}
  .focus-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
  .focus-head h3{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);
    font-weight:700;display:flex;align-items:center;gap:8px;}
  .fcnt{background:var(--gold);color:#2b1f05;font-size:11px;padding:1px 8px;border-radius:99px;letter-spacing:0;}
  .focus-add-sm{background:transparent;border:1px solid rgba(217,177,78,.4);color:var(--gold);
    font:inherit;font-size:12px;font-weight:600;padding:5px 11px;border-radius:99px;cursor:pointer;}
  .fitem{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin-bottom:8px;}
  .fitem:last-child{margin-bottom:0;}
  .ftop{display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
  .ftitle{font-size:15px;font-weight:700;color:var(--text);}
  .fleft{font-size:11px;font-weight:600;color:var(--gold);flex-shrink:0;}
  .fcontent{font-size:12px;color:var(--text-dim);margin-top:4px;line-height:1.45;}
  .fcounts{display:flex;gap:6px;margin-top:10px;}
  .fbtn{flex:1;background:var(--surface);border:1px solid var(--line);color:var(--text-dim);
    font:inherit;font-size:12px;font-weight:600;padding:9px 6px;border-radius:9px;cursor:pointer;

function placeLabel(c,kurz){return c==="D"?(kurz?"med.":"medinensisch"):(kurz?"mek.":"mekkanisch");}

// ---- State ----
const KEY="quranRevision_v2";
const DEFAULT_STATE={
  groups:[
    {id:"a",name:"Tag A",days:[0,2,4,6],surahs:[]},
    {id:"b",name:"Tag B",days:[1,3,5],surahs:[]}
  ],
  checks:{},
  dayGroups:{}
};
let state;
function load(){
  try{const raw=localStorage.getItem(KEY);state=raw?JSON.parse(raw):structuredClone(DEFAULT_STATE);}
  catch(e){state=structuredClone(DEFAULT_STATE);}
  if(!state.groups)state.groups=structuredClone(DEFAULT_STATE.groups);
  if(!state.checks)state.checks={};
  if(!state.dayGroups)state.dayGroups={};
  if(!state.focus)state.focus=[];
  if(!state.focusLog)state.focusLog={};
  // Migration: Gruppen ohne Wochentage bekommen das bisherige Alternieren
  const n=state.groups.length;
  state.groups.forEach((g,i)=>{
    if(!Array.isArray(g.days)){
      g.days=[];
      if(n>0)for(let wd=0;wd<7;wd++)if(wd%n===i)g.days.push(wd);
    }
  });
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}

function keyOf(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function todayKey(){return keyOf(new Date());}
function selKey(){return keyOf(selectedDate);}
function isSameDay(a,b){return keyOf(a)===keyOf(b);}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function startOfDay(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function parseKey(k){const[Y,M,D]=k.split("-").map(Number);return new Date(Y,M-1,D);}
function hijriParts(d){
  try{
    return {
      ar:new Intl.DateTimeFormat("ar-SA-u-ca-islamic",{day:"numeric",month:"long",year:"numeric"}).format(d),
      latin:new Intl.DateTimeFormat("en-US-u-ca-islamic",{day:"numeric",month:"long",year:"numeric"}).format(d),
      dayNum:new Intl.DateTimeFormat("en-US-u-ca-islamic",{day:"numeric"}).format(d)
    };
  }catch(e){return{ar:"",latin:"",dayNum:String(d.getDate())};}

function fmtPages(p){const r=Math.round(p*10)/10;return(r%1===0?r.toFixed(0):r.toFixed(1)).replace(".",",");}

// ---- Groups & rotation ----
function getGroup(id){return state.groups.find(g=>g.id===id);}
function groupsForWeekday(wd){return state.groups.filter(g=>Array.isArray(g.days)&&g.days.includes(wd));}
function activeGroupIdsFor(d){
  const k=keyOf(d);
  if(k in state.dayGroups){
    return state.dayGroups[k].filter(id=>getGroup(id));
  }
  return groupsForWeekday(d.getDay()).map(g=>g.id);
}
function isCustomDay(d){return keyOf(d) in state.dayGroups;}

// ---- Fokus ----
function focusActiveOn(f,d){
  const k=keyOf(d);
  if(f.mode==="today")return k===f.date;
  if(f.mode==="until")return k>=f.start&&k<=f.date;
  if(f.mode==="weekdays")return k>=f.start&&Array.isArray(f.days)&&f.days.includes(d.getDay());
  return k>=f.start; // open
}
function focusFor(d){return state.focus.filter(f=>focusActiveOn(f,d));}
function focusLog(fid,d){
  const k=keyOf(d);
  return (state.focusLog[k]&&state.focusLog[k][fid])||{read:0,memo:0};
}
function bumpFocus(fid,kind,delta){
  const k=selKey();
  if(!state.focusLog[k])state.focusLog[k]={};
  if(!state.focusLog[k][fid])state.focusLog[k][fid]={read:0,memo:0};
  const e=state.focusLog[k][fid];
  e[kind]=Math.max(0,(e[kind]||0)+delta);
  if(!e.read&&!e.memo)delete state.focusLog[k][fid];
  if(!Object.keys(state.focusLog[k]).length)delete state.focusLog[k];
  save();render();
}
function focusTotals(fid){
  let read=0,memo=0,days=0;
  Object.keys(state.focusLog).forEach(k=>{
    const e=state.focusLog[k][fid];
    if(e){read+=e.read||0;memo+=e.memo||0;days++;}
  });
  return{read,memo,days};
}
function focusContentLabel(f){
  return f.items.map(x=>x.name+(x.vFrom?" "+x.vFrom+"–"+x.vTo:"")).join(", ");
}
function focusRangeLabel(f,d){
  if(f.mode==="today")return "nur "+parseKey(f.date).toLocaleDateString("de-CH",{day:"numeric",month:"short"});
  if(f.mode==="until"){
    const end=parseKey(f.date),today=startOfDay(d||new Date());
    const left=Math.round((startOfDay(end)-today)/86400000);
    if(left<0)return "beendet";
    return left===0?"letzter Tag":"noch "+left+" Tag"+(left===1?"":"e");
  }
  if(f.mode==="weekdays")return (f.days||[]).slice().sort((a,b)=>a-b).map(k=>WD[k].kurz).join(", ");
  return "ohne Ende";
}
function focusExpired(f){
  const t=todayKey();
  if(f.mode==="today")return f.date<t;
  if(f.mode==="until")return f.date<t;
  return false;
}
function daysLabel(g){
  if(!Array.isArray(g.days)||!g.days.length)return "keinem Tag zugeordnet";
  if(g.days.length===7)return "täglich";
  return g.days.slice().sort((a,b)=>a-b).map(x=>WD[x].kurz).join(", ");
}
function setDayGroups(d,ids){state.dayGroups[keyOf(d)]=ids;save();}
function dayTotals(d){
  const ids=activeGroupIdsFor(d);
  const checks=state.checks[keyOf(d)]||{};
  let total=0,done=0;
  ids.forEach(id=>{const g=getGroup(id);if(!g)return;
    g.surahs.forEach(s=>{total++;if(checks[s.id])done++;});});
  return{total,done};
}
function dayStatus(d){
  const{total,done}=dayTotals(d);
  if(!total)return"none";
  if(done===0)return"none";
  return done>=total?"done":"partial";
}
function missedDays(){
  const keys=Object.keys(state.checks).filter(k=>Object.keys(state.checks[k]||{}).length);
  if(!keys.length)return[];
  const first=parseKey(keys.sort()[0]);
  const yest=addDays(startOfDay(new Date()),-1);
  const out=[];
  for(let d=new Date(first);d<=yest;d=addDays(d,1)){
    const{total,done}=dayTotals(d);
    if(total>0&&done<total)out.push({date:new Date(d),total,done});
  }
  return out.reverse();
}

// ---- Render ----
function render(){
  const d=selectedDate;
  document.getElementById("dateGreg").textContent=d.toLocaleDateString("de-CH",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  const h=hijriParts(d);
  document.getElementById("dateHijri").innerHTML=h.ar+' <span class="latin">· '+h.latin+'</span>';

  const viewingToday=isSameDay(d,new Date());
  const badge=document.getElementById("dayBadge");
  if(viewingToday){badge.textContent="Heute";badge.className="day-badge today";}
  else{badge.textContent=startOfDay(d)>startOfDay(new Date())?"Zukunft":"Vergangen";badge.className="day-badge other";}
  document.getElementById("jumpToday").style.display=viewingToday?"none":"inline-flex";

  renderCalendar();
  renderMissed();
  renderFocus();
  renderDay();
  renderGroupManager();
  renderFocusManager();
}

function renderFocus(){
  const box=document.getElementById("focusBox");
  const list=document.getElementById("focusList");
  const active=focusFor(selectedDate);
  if(!active.length){box.style.display="none";return;}
  box.style.display="";
  document.getElementById("focusCount").textContent=active.length;
  list.innerHTML="";
  active.forEach(f=>{
    const lg=focusLog(f.id,selectedDate);
    const tot=focusTotals(f.id);
    const el=document.createElement("div");el.className="fitem";
    el.innerHTML=
      '<div class="ftop"><span class="ftitle">'+esc(f.title||focusContentLabel(f))+'</span>'+
      '<span class="fleft">'+esc(focusRangeLabel(f,selectedDate))+'</span></div>'+
      (f.title?'<div class="fcontent">'+esc(focusContentLabel(f))+'</div>':'')+
      '<div class="fcounts">'+
        '<button class="fminus" data-k="read" '+(lg.read?'':'disabled')+'>−</button>'+
        '<button class="fbtn'+(lg.read?' has':'')+'" data-k="read">Gelesen'+(lg.read?'<span class="fnum">'+lg.read+'</span>':'')+'</button>'+
        '<button class="fbtn'+(lg.memo?' has':'')+'" data-k="memo">Auswendig'+(lg.memo?'<span class="fnum">'+lg.memo+'</span>':'')+'</button>'+
        '<button class="fminus" data-k="memo" '+(lg.memo?'':'disabled')+'>−</button>'+
      '</div>'+
      (tot.read||tot.memo?'<div class="ftotal">Gesamt: '+tot.read+'× gelesen · '+tot.memo+'× auswendig · an '+tot.days+' Tag(en)</div>':'');
    el.querySelectorAll(".fbtn").forEach(b=>b.onclick=()=>bumpFocus(f.id,b.dataset.k,1));
    el.querySelectorAll(".fminus").forEach(b=>{if(!b.disabled)b.onclick=()=>bumpFocus(f.id,b.dataset.k,-1);});
    list.appendChild(el);
  });
}

function renderFocusManager(){
  const box=document.getElementById("focusManager");box.innerHTML="";
  if(!state.focus.length){
    box.innerHTML='<div class="empty">Noch kein Fokus angelegt.<br>Damit kannst du eine Portion zusätzlich zur Wiederholung vertiefen.</div>';
    return;
  }
  state.focus.forEach(f=>{
    const exp=focusExpired(f);
    const tot=focusTotals(f.id);
    const row=document.createElement("div");row.className="frow"+(exp?" done-f":"");
    row.innerHTML='<div class="finfo">'+
        '<div class="fname">'+esc(f.title||focusContentLabel(f))+'</div>'+
        '<div class="fmeta">'+esc(exp?"beendet":focusRangeLabel(f))+'</div>'+
        '<div class="fsub">'+esc(focusContentLabel(f))+
          (tot.read||tot.memo?' · '+tot.read+'× gel., '+tot.memo+'× ausw.':'')+'</div>'+
      '</div>'+
      '<div class="surah-tools">'+
      '<button class="stool ren">✎</button>'+
      '<button class="stool del">×</button></div>';
    row.querySelector(".ren").onclick=()=>openFocusModal(f.id);
    row.querySelector(".del").onclick=()=>askConfirm("Fokus „"+(f.title||focusContentLabel(f))+"“ löschen?",()=>{
      state.focus=state.focus.filter(x=>x.id!==f.id);
      Object.keys(state.focusLog).forEach(k=>{delete state.focusLog[k][f.id];
        if(!Object.keys(state.focusLog[k]).length)delete state.focusLog[k];});

    });
    box.appendChild(row);
  });
}

function renderDay(){
  const d=selectedDate;
  const activeIds=activeGroupIdsFor(d);
  const wd=WD[d.getDay()];
  const checks=state.checks[keyOf(d)]||{};

  document.getElementById("todayLabel").innerHTML=
    esc(wd.de)+' <span class="wd-ar">'+wd.ar+'</span>';

  // group toggles
  const sw=document.getElementById("switch");sw.innerHTML="";
  state.groups.forEach(g=>{
    const b=document.createElement("button");
    const assigned=Array.isArray(g.days)&&g.days.includes(d.getDay());
    b.innerHTML=esc(g.name)+(assigned?'<span class="wd-mark">•</span>':'');
    b.className=activeIds.includes(g.id)?"active":"";
    b.onclick=()=>{
      let ids=activeGroupIdsFor(d).slice();
      if(ids.includes(g.id))ids=ids.filter(x=>x!==g.id);
      else ids.push(g.id);
      ids.sort((x,y)=>state.groups.findIndex(a=>a.id===x)-state.groups.findIndex(a=>a.id===y));
      setDayGroups(d,ids);render();
    };
    sw.appendChild(b);
  });

  const note=document.getElementById("suggestText");
  const planned=groupsForWeekday(d.getDay());
  const resetBtn=document.getElementById("undoCustom");
  if(!state.groups.length)note.textContent="Noch keine Gruppen angelegt";
  else if(isCustomDay(d)){
    note.textContent="Nur für diesen Tag geändert · "+wd.kurz+" wäre: "+(planned.length?planned.map(g=>g.name).join(", "):"nichts");
    resetBtn.style.display="inline-flex";
  }else{
    note.textContent=planned.length?("Nach Wochentag: "+planned.map(g=>g.name).join(", ")):(wd.de+" ist keiner Gruppe zugeordnet");
    resetBtn.style.display="none";
  }

  // blocks
  const wrap=document.getElementById("dayBlocks");wrap.innerHTML="";
  if(!activeIds.length){
    wrap.innerHTML='<div class="empty">Wähle oben eine Gruppe aus, um zu starten.</div>';
  }
  activeIds.forEach(gid=>{
    const g=getGroup(gid);if(!g)return;
    const block=document.createElement("div");block.className="gblock";
    const pages=g.surahs.reduce((s,x)=>s+(x.p||0),0);
    const gAyat=g.surahs.reduce((s,x)=>{
      if(x.vFrom&&x.vTo)return s+(x.vTo-x.vFrom+1);
      const inf=x.n?surahByNum(x.n):null;
      return s+(inf?inf.ayat:0);
    },0);
    const gd=g.surahs.filter(s=>checks[s.id]).length;
    const editing=!!editGroups[gid];
    block.innerHTML=
      '<div class="gblock-head"><div><div class="gblock-name">'+esc(g.name)+'</div>'+
      '<div class="gblock-meta">'+gd+'/'+g.surahs.length+
      (gAyat?' · '+gAyat+' Verse':'')+' · ca. '+fmtPages(pages)+' Seiten</div></div>'+
      (g.surahs.length?'<button class="edit-toggle">'+(editing?"Fertig":"Bearbeiten")+'</button>':'')+
      '</div><div class="surah-list"></div>'+
      '<button class="add-btn">+ Surah zu '+esc(g.name)+'</button>'+
      (gd>0?'<button class="group-reset">Erledigte des Tages zurücksetzen</button>':'');
    const et=block.querySelector(".edit-toggle");
    if(et)et.onclick=()=>{editGroups[gid]=!editing;render();};
    block.querySelector(".add-btn").onclick=()=>openSurahModal(gid);
    const gr=block.querySelector(".group-reset");
    if(gr)gr.onclick=()=>{
      askConfirm("Alle Häkchen von „"+g.name+"“ für diesen Tag wirklich zurücksetzen? "+
        "("+gd+" erledigt)",()=>resetGroupDay(gid),"Zurücksetzen");
    };

    const list=block.querySelector(".surah-list");
    if(!g.surahs.length){
      list.innerHTML='<div class="empty">Noch keine Suren in dieser Gruppe.<br>Tippe unten auf „+ Surah".</div>';
    }
    g.surahs.forEach((s,idx)=>{
      const mark=checks[s.id];
      const done=!!mark;
      const mm=methodsOf(mark);
      const el=document.createElement("div");
      el.className="surah"+(done?" done":"");
      const info=s.n?surahByNum(s.n):null;
      const sub=[
        s.n?("Sure "+s.n):"",
        info?placeLabel(info.place,true):"",
        s.vFrom?("Vers "+s.vFrom+"–"+s.vTo+(info?" von "+info.ayat:"")):(info?info.ayat+" Verse":""),
        s.p?("~"+fmtPages(s.p)+" S."):""
      ].filter(Boolean).join(" · ");
      const mLabels=[mm.read?"gelesen":"",mm.memo?"auswendig":""].filter(Boolean).join(" + ");
      const mtag=mLabels?'<span class="mtag"> · '+mLabels+'</span>':"";
      el.innerHTML=
        '<div class="surah-main">'+
        (editing?'':'<div class="check">'+CHECK_SVG+'</div>')+
        '<div class="surah-info"><div class="surah-name">'+esc(s.name)+'</div>'+
        '<div class="surah-num">'+esc(sub)+mtag+'</div></div>'+
        (editing?'':'<div class="surah-ar">'+esc(s.ar||"")+'</div>')+
        (editing?'<div class="surah-tools">'+
          '<button class="stool up"'+(idx===0?" disabled":"")+'>↑</button>'+
          '<button class="stool down"'+(idx===g.surahs.length-1?" disabled":"")+'>↓</button>'+
          '<button class="stool ed">✎</button>'+
          '<button class="stool del">×</button></div>':'')+
        '</div>'+
        ((done&&!editing)?'<div class="method-row">'+
          '<button class="mbtn'+(mm.read?" active":"")+'" data-m="read">Gelesen</button>'+
          '<button class="mbtn'+(mm.memo?" active":"")+'" data-m="memo">Auswendig</button>'+
        '</div>':'');
      if(editing){
        el.querySelector(".surah-main").style.cursor="default";
        el.querySelector(".up").onclick=()=>moveSurah(gid,idx,-1);
        el.querySelector(".down").onclick=()=>moveSurah(gid,idx,1);
        el.querySelector(".ed").onclick=()=>openSurahModal(gid,s.id);
        el.querySelector(".del").onclick=()=>{
          askConfirm("„"+s.name+"“ aus der Gruppe entfernen?",()=>delSurah(gid,s.id));
        };
      }else{
        el.querySelector(".surah-main").onclick=()=>toggle(s.id);
        el.querySelectorAll(".mbtn").forEach(b=>{
          b.onclick=(e)=>{e.stopPropagation();setMethod(s.id,b.dataset.m);};
        });
      }
      list.appendChild(el);
    });
    wrap.appendChild(block);
  });

  const{total,done}=dayTotals(d);
  const pct=total?Math.round(done/total*100):0;
  document.getElementById("progFill").style.width=pct+"%";
  document.getElementById("progLabel").textContent=done+" / "+total;
  document.getElementById("progPct").textContent=pct+"%";
}

  if(!state.groups.length){box.innerHTML='<div class="empty">Keine Gruppen. Lege unten eine an.</div>';return;}
  const checks=state.checks[selKey()]||{};
  const activeIds=activeGroupIdsFor(selectedDate);
  state.groups.forEach((g,i)=>{
    const done=g.surahs.filter(s=>checks[s.id]).length;

        '<div class="gname">'+esc(g.name)+(isActive?' <span class="gactive">heute aktiv</span>':'')+'</div>'+
        '<div class="gdays">'+esc(daysLabel(g))+'</div>'+
        '<div class="gprog"><div class="gbar"><div class="gbar-fill '+stCls+'" style="width:'+pct+'%"></div></div>'+
        '<span class="gprog-txt '+stCls+'">'+done+'/'+tot+'</span></div>'+
      '</div>'+
      '<div class="surah-tools">'+
      '<button class="stool up"'+(i===0?" disabled":"")+'>↑</button>'+
      '<button class="stool down"'+(i===state.groups.length-1?" disabled":"")+'>↓</button>'+
      '<button class="stool ren">✎</button>'+
      '<button class="stool del">×</button></div>';
    row.querySelector(".up").onclick=()=>moveGroup(i,-1);
    row.querySelector(".down").onclick=()=>moveGroup(i,1);
    row.querySelector(".ren").onclick=()=>openGroupModal(g.id);
    row.querySelector(".del").onclick=()=>{
      askConfirm("Gruppe „"+g.name+"“ mit "+g.surahs.length+" Suren löschen?",()=>{
        state.groups=state.groups.filter(x=>x.id!==g.id);

function renderMissed(){
  const box=document.getElementById("missedBox");
  const list=document.getElementById("missedList");
  const moreBtn=document.getElementById("missedMore");
  const days=missedDays();
  if(!days.length){box.style.display="none";return;}
  box.style.display="";

  const show=missedExpanded?days:days.slice(0,3);
  list.innerHTML="";
  show.forEach(m=>{
    const h=hijriParts(m.date);
    const ids=activeGroupIdsFor(m.date);
    const names=ids.map(id=>{const g=getGroup(id);return g?g.name:"";}).filter(Boolean).join(", ");
    const row=document.createElement("div");row.className="mrow";
    row.innerHTML='<div class="mdate"><div class="mh">'+h.ar+'</div>'+
      '<div class="mg">'+m.date.toLocaleDateString("de-CH",{weekday:"short",day:"numeric",month:"short"})+' · '+esc(names||"–")+'</div></div>'+
      '<span class="mp">'+m.done+'/'+m.total+'</span>';

}

// ---- Calendar ----
function renderCalendar(){
  document.querySelectorAll(".cal-modes button").forEach(b=>b.classList.toggle("active",b.dataset.mode===calMode));
  const body=document.getElementById("calBody");
  document.getElementById("calPrev").disabled=false;
  document.getElementById("calNext").disabled=false;
  if(calMode==="month")renderMonth(body);else renderWeek(body);
}
function renderMonth(body){
  const y=calCursor.getFullYear(),m=calCursor.getMonth();
  const first=new Date(y,m,1);
  let hLabel="";
  try{hLabel=new Intl.DateTimeFormat("en-US-u-ca-islamic",{month:"long",year:"numeric"}).format(new Date(y,m,15));}catch(e){}
  document.getElementById("calTitle").innerHTML=
    '<span class="htitle">'+hLabel+'</span><span class="gtitle">'+
    first.toLocaleDateString("de-CH",{month:"long",year:"numeric"})+'</span>';
  const startDow=first.getDay();
  const daysInMonth=new Date(y,m+1,0).getDate();
  let html='<div class="cal-grid">';
  WD.forEach(x=>html+='<div class="cal-dow">'+x.kurz+'</div>');
  for(let i=0;i<startDow;i++)html+='<div class="cal-cell empty"></div>';
  for(let day=1;day<=daysInMonth;day++){
    const d=new Date(y,m,day);
    const h=hijriParts(d);
    const st=dayStatus(d);
    const ids=activeGroupIdsFor(d);
    let tag="";
    if(ids.length===1){const g=getGroup(ids[0]);tag=g?shortName(g.name):"";}
    else if(ids.length>1)tag=ids.length+"×";
    const cls="cal-cell"+(isSameDay(d,new Date())?" today":"")+(isSameDay(d,selectedDate)?" sel":"");
    html+='<div class="'+cls+'" data-d="'+keyOf(d)+'">'+
      '<span class="gtag">'+esc(tag)+'</span>'+
      '<span class="hd">'+h.dayNum+'</span>'+
      '<span class="gd">'+day+'</span>'+
      '<span class="stat '+st+'"></span></div>';
  }
  html+='</div>';
  body.innerHTML=html;
  body.querySelectorAll(".cal-cell[data-d]").forEach(c=>c.onclick=()=>selectDay(parseKey(c.dataset.d)));
}
function startOfWeek(d){const x=startOfDay(d);x.setDate(x.getDate()-x.getDay());return x;}
function renderWeek(body){
  const start=startOfWeek(calCursor);
  const end=addDays(start,6);
  const hs=hijriParts(start),he=hijriParts(end);
  const sameMonth=start.getMonth()===end.getMonth();
  document.getElementById("calTitle").innerHTML=
    '<span class="htitle">'+esc(hs.latin.replace(/,?\s*\d{4}\s*AH?$/,""))+' – '+esc(he.latin)+'</span>'+
    '<span class="gtitle">'+start.toLocaleDateString("de-CH",{day:"numeric",month:sameMonth?undefined:"short"})+
    '. – '+end.toLocaleDateString("de-CH",{day:"numeric",month:"short",year:"numeric"})+'</span>';

  let html='<div class="wk">';
  for(let i=0;i<7;i++){
    const d=addDays(start,i);
    const w=WD[d.getDay()];
    const st=dayStatus(d);
    const ids=activeGroupIdsFor(d);
    const names=ids.map(id=>{const g=getGroup(id);return g?g.name:"";}).filter(Boolean);
    const {total,done}=dayTotals(d);
    const isToday=isSameDay(d,new Date());
    const cls="wkrow"+(isToday?" today":"")+(isSameDay(d,selectedDate)?" sel":"");
    html+='<div class="'+cls+'" data-d="'+keyOf(d)+'">'+
      '<div class="wkday"><span class="wkde">'+w.de+'</span><span class="wkar">'+w.ar+'</span></div>'+
      '<div class="wkmid"><div class="wkgroups">'+(names.length?esc(names.join(", ")):'<span class="wknone">—</span>')+
        (isCustomDay(d)?'<span class="wkcustom">geändert</span>':'')+'</div>'+
        '<div class="wkdate">'+d.toLocaleDateString("de-CH",{day:"numeric",month:"short"})+' · '+hijriParts(d).dayNum+'</div></div>'+
      '<div class="wkstat"><span class="wsdot '+st+'"></span>'+(total?'<span class="wsnum">'+done+'/'+total+'</span>':'')+'</div>'+
      '</div>';
  }
  html+='</div>';
  body.innerHTML=html;
  body.querySelectorAll(".wkrow[data-d]").forEach(c=>c.onclick=()=>selectDay(parseKey(c.dataset.d)));
}

// ---- Actions ----
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function shortName(n){const m=String(n).match(/([A-Za-z0-9\u00C0-\u017F]+)\s*$/);return(m?m[1]:n).slice(0,4);}
function selectDay(d){selectedDate=new Date(d);calCursor=new Date(d);render();window.scrollTo({top:0,behavior:"smooth"});}
function toggle(id){
  const k=selKey();
  if(!state.checks[k])state.checks[k]={};
  if(state.checks[k][id])delete state.checks[k][id];else state.checks[k][id]=true;
  if(!Object.keys(state.checks[k]).length)delete state.checks[k];
  save();render();
}
function methodsOf(v){return{read:(v==="read"||v==="both"),memo:(v==="memo"||v==="both")};}
function markValue(m){return(m.read&&m.memo)?"both":m.read?"read":m.memo?"memo":true;}
function setMethod(id,m){
  const k=selKey();
  if(!state.checks[k]||!state.checks[k][id])return;
  const cur=methodsOf(state.checks[k][id]);
  cur[m]=!cur[m];
  state.checks[k][id]=markValue(cur);
  save();render();
}
function resetGroupDay(gid){
  const g=getGroup(gid);if(!g)return;
  const k=selKey();
  if(!state.checks[k])return;
  g.surahs.forEach(s=>{delete state.checks[k][s.id];});
  if(!Object.keys(state.checks[k]).length)delete state.checks[k];
  save();render();
}
function delSurah(gid,sid){const g=getGroup(gid);if(!g)return;g.surahs=g.surahs.filter(s=>s.id!==sid);save();render();}
function moveSurah(gid,i,dir){
  const g=getGroup(gid);if(!g)return;
  const j=i+dir;if(j<0||j>=g.surahs.length)return;
  [g.surahs[i],g.surahs[j]]=[g.surahs[j],g.surahs[i]];save();render();
}
function moveGroup(i,dir){
  const j=i+dir;if(j<0||j>=state.groups.length)return;
  [state.groups[i],state.groups[j]]=[state.groups[j],state.groups[i]];save();render();
}

// ---- Surah modal ----
let scopeMode="full";
let editingSurah=null;   // {gid, sid} beim Bearbeiten
function openSurahModal(preselectGroup,sid){
  editingSurah=null;
  let entry=null;
  if(sid){
    const g0=getGroup(preselectGroup);
    entry=g0?g0.surahs.find(x=>x.id===sid):null;
    if(entry)editingSurah={gid:preselectGroup,sid:sid};
  }
  const gsel=document.getElementById("surahGroupSelect");gsel.innerHTML="";
  state.groups.forEach(g=>{const o=document.createElement("option");o.value=g.id;o.textContent=g.name;gsel.appendChild(o);});
  if(preselectGroup)gsel.value=preselectGroup;
  const pick=document.getElementById("surahPickSelect");pick.innerHTML="";
  SURAH_DB.forEach(s=>{const o=document.createElement("option");o.value=s[0];o.textContent=s[0]+". "+s[1]+" — "+s[2];pick.appendChild(o);});
  const c=document.createElement("option");c.value="custom";c.textContent="✎ Eigener Eintrag…";pick.appendChild(c);

  // Bereichs-Dropdowns
  ["surahFromSelect","surahToSelect"].forEach(id=>{
    const sel=document.getElementById(id);sel.innerHTML="";
    SURAH_DB.forEach(s=>{const o=document.createElement("option");o.value=s[0];o.textContent=s[0]+". "+s[1];sel.appendChild(o);});
  });
  document.getElementById("surahFromSelect").value="78";   // An-Naba'
  document.getElementById("surahToSelect").value="114";    // An-Nas
  multiSel=[];
  document.getElementById("multiSearch").value="";

  // "Von–bis" nur beim Hinzufügen anbieten
  document.getElementById("scopeRangeBtn").style.display=entry?"none":"";

  document.getElementById("surahModalTitle").textContent=entry?"Surah bearbeiten":"Surah hinzufügen";
  document.getElementById("saveSurahBtn").textContent=entry?"Speichern":"Hinzufügen";
  document.getElementById("surahError").textContent="";

  if(entry){
    pick.value=entry.n?String(entry.n):"custom";
    scopeMode=entry.vFrom?"part":"full";
  }else{
    pick.value="1";
    scopeMode="full";
  }
  document.querySelectorAll("#scopeSeg button").forEach(b=>b.classList.toggle("active",b.dataset.scope===scopeMode));
  applyPick(!!entry);

  // Werte NACH applyPick setzen, damit sie nicht überschrieben werden
  if(entry){
    document.getElementById("vFromInput").value=entry.vFrom||"";
    document.getElementById("vToInput").value=entry.vTo||"";
    document.getElementById("surahPagesInput").value=(entry.p!=null?entry.p:"");
    document.getElementById("surahNameInput").value=entry.n?"":(entry.name||"");
    document.getElementById("surahArInput").value=entry.n?"":(entry.ar||"");
  }else{
    document.getElementById("vFromInput").value="";
    document.getElementById("vToInput").value="";
    document.getElementById("surahNameInput").value="";
    document.getElementById("surahArInput").value="";
  }
  document.getElementById("surahModal").classList.add("open");
}
function applyPick(keepPages){
  const v=document.getElementById("surahPickSelect").value;
  const isCustom=(v==="custom");
  const isRange=(scopeMode==="range");
  document.getElementById("singlePickField").style.display=isRange?"none":"";
  document.getElementById("customNameField").style.display=(!isRange&&isCustom)?"":"none";
  document.getElementById("customArField").style.display=(!isRange&&isCustom)?"":"none";
  document.getElementById("rangeFields").style.display=isRange?"":"none";
  document.getElementById("verseFields").style.display=(scopeMode==="part")?"":"none";
  document.getElementById("pagesField").style.display=isRange?"none":"";
  if(isRange){renderMultiList();updateRangeHint();return;}
  const hint=document.getElementById("verseHint");
  const sInfo=document.getElementById("surahInfo");
  const pHint=document.getElementById("pagesHint");
  const pIn=document.getElementById("surahPagesInput");
  if(isCustom){
    hint.textContent="";sInfo.textContent="";
    pHint.textContent="Bitte selbst eintragen.";
    if(!keepPages&&scopeMode==="full")pIn.value="";
  }else{
    const s=surahByNum(parseInt(v));
    if(s){
      sInfo.textContent=placeLabel(s.place)+" · "+s.ayat+" Verse · ganze Surah ≈ "+fmtPages(s.p)+" Seiten";
      if(scopeMode==="part"){
        hint.textContent="Gültiger Bereich: 1 bis "+s.ayat;
        pHint.textContent="Bei Teilbereichen bitte selbst schätzen.";
        if(!keepPages)pIn.value="";
      }else{
        hint.textContent="";
        pHint.textContent="Automatisch eingesetzt, überschreibbar.";
        if(!keepPages)pIn.value=s.p;
      }
    }
  }
}
let multiSel=[];   // ausgewählte Surennummern in Auswahlreihenfolge
function renderMultiList(){
  const q=document.getElementById("multiSearch").value.trim().toLowerCase();
  const box=document.getElementById("multiList");
  box.innerHTML="";
  SURAH_DB.forEach(s=>{
    const n=s[0],name=s[1],ar=s[2],ayat=s[4],place=s[5];
    if(q&&!(name.toLowerCase().includes(q)||ar.includes(q)||String(n)===q))return;
    const pos=multiSel.indexOf(n);
    const on=pos>=0;
    const row=document.createElement("div");
    row.className="mitem"+(on?" on":"");
    row.innerHTML='<div class="mbox">'+CHECK_SVG+'</div>'+
      '<span class="mname">'+n+'. '+esc(name)+
      '<span class="msub">'+ayat+' Verse · '+placeLabel(place,true)+'</span></span>'+
      (on?'<span class="mord">'+(pos+1)+'</span>':'')+
      '<span class="mar">'+esc(ar)+'</span>';
    row.onclick=()=>{
      const i=multiSel.indexOf(n);
      if(i>=0)multiSel.splice(i,1);else multiSel.push(n);
      renderMultiList();updateRangeHint();
    };
    box.appendChild(row);
  });
  if(!box.children.length)box.innerHTML='<div style="padding:14px;text-align:center;color:var(--text-dim);font-size:13px;">Nichts gefunden</div>';
}
function applyRangeToSelection(){
  const a=parseInt(document.getElementById("surahFromSelect").value);
  const b=parseInt(document.getElementById("surahToSelect").value);
  if(isNaN(a)||isNaN(b))return;
  const step=a<=b?1:-1;
  for(let i=a;step>0?i<=b:i>=b;i+=step){
    if(!multiSel.includes(i))multiSel.push(i);
  }
  renderMultiList();updateRangeHint();
}
function updateRangeHint(){
  const h=document.getElementById("rangeHint");
  if(!multiSel.length){h.textContent="Noch nichts ausgewählt.";return;}
  const list=multiSel.map(surahByNum).filter(Boolean);
  const pages=list.reduce((s,x)=>s+x.p,0);
  const ayat=list.reduce((s,x)=>s+x.ayat,0);
  const mad=list.filter(x=>x.place==="D").length;
  h.textContent=list.length+" ausgewählt · "+ayat+" Verse · ca. "+fmtPages(pages)+" Seiten"+
    (mad?" · "+mad+" med., "+(list.length-mad)+" mek.":"");
}
document.getElementById("surahPickSelect").addEventListener("change",()=>applyPick());
document.getElementById("multiSearch").addEventListener("input",renderMultiList);
document.getElementById("rangeApplyBtn").onclick=applyRangeToSelection;
document.getElementById("clearSelBtn").onclick=()=>{multiSel=[];renderMultiList();updateRangeHint();};
document.querySelectorAll("#scopeSeg button").forEach(b=>{
  b.onclick=()=>{scopeMode=b.dataset.scope;
    document.querySelectorAll("#scopeSeg button").forEach(x=>x.classList.toggle("active",x===b));
    applyPick();};
});
document.getElementById("saveSurahBtn").onclick=()=>{
  const err=document.getElementById("surahError");
  const fail=(m)=>{err.textContent=m;};
  err.textContent="";
  const pv=document.getElementById("surahPickSelect").value;
  const gid=document.getElementById("surahGroupSelect").value;
  const g=getGroup(gid);
  if(!g){fail("Bitte zuerst eine Gruppe anlegen.");return;}
  const pRaw=parseFloat(String(document.getElementById("surahPagesInput").value).replace(",","."));
  const p=isNaN(pRaw)?null:pRaw;

  // Mehrere Suren auf einmal
  if(scopeMode==="range"){
    if(!multiSel.length){fail("Bitte mindestens eine Surah auswählen.");return;}
    multiSel.map(surahByNum).filter(Boolean).forEach(s=>{
      g.surahs.push({id:"s"+Date.now()+Math.random().toString(36).slice(2,8),
        n:s.n,name:s.name,ar:s.ar,p:s.p,vFrom:null,vTo:null});
    });
    save();closeModals();render();return;
  }

  let name,ar,num=null,maxAyat=null;
  if(pv==="custom"){
    name=document.getElementById("surahNameInput").value.trim();
    if(!name){fail("Bitte einen Namen eingeben.");return;}
    ar=document.getElementById("surahArInput").value.trim();
  }else{
    const s=surahByNum(parseInt(pv));
    if(!s){fail("Bitte eine Surah wählen.");return;}
    name=s.name;ar=s.ar;num=s.n;maxAyat=s.ayat;
  }
  let vFrom=null,vTo=null;
  if(scopeMode==="part"){
    vFrom=parseInt(document.getElementById("vFromInput").value);
    vTo=parseInt(document.getElementById("vToInput").value);
    if(isNaN(vFrom)||isNaN(vTo)){fail("Bitte Vers von und bis eingeben.");return;}
    if(vFrom<1||vTo<vFrom){fail("Ungültiger Versbereich.");return;}
    if(maxAyat&&vTo>maxAyat){fail(name+" hat nur "+maxAyat+" Verse.");return;}
  }
  if(editingSurah){
    const oldG=getGroup(editingSurah.gid);
    const item=oldG?oldG.surahs.find(x=>x.id===editingSurah.sid):null;
    if(item){
      item.n=num;item.name=name;item.ar=ar;item.p=p;item.vFrom=vFrom;item.vTo=vTo;
      if(oldG&&oldG.id!==g.id){
        oldG.surahs=oldG.surahs.filter(x=>x.id!==item.id);
        g.surahs.push(item);
      }
    }
    editingSurah=null;
  }else{
    g.surahs.push({id:"s"+Date.now()+Math.random().toString(36).slice(2,6),n:num,name,ar,p,vFrom,vTo});
  }
  save();closeModals();render();
};

// ---- Group modal ----
let wdSel=[];
function renderWdPick(){
  const box=document.getElementById("wdPick");box.innerHTML="";
  WD.forEach(w=>{
    const b=document.createElement("button");
    b.className=wdSel.includes(w.k)?"on":"";
    b.innerHTML='<span>'+w.kurz+'</span><span class="wpar">'+w.ar+'</span>';
    b.onclick=()=>{
      const i=wdSel.indexOf(w.k);
      if(i>=0)wdSel.splice(i,1);else wdSel.push(w.k);
      renderWdPick();
    };
    box.appendChild(b);
  });
  const h=document.getElementById("wdHint");
  if(!wdSel.length)h.textContent="Ohne Zuordnung erscheint die Gruppe an keinem Tag automatisch.";
  else{
    const others=state.groups.filter(g=>g.id!==editingGroupId&&Array.isArray(g.days));
    const overlap=wdSel.filter(k=>others.some(g=>g.days.includes(k)));
    h.textContent=wdSel.length+" Tag(e) gewählt"+
      (overlap.length?" · an "+overlap.sort((a,b)=>a-b).map(k=>WD[k].kurz).join(", ")+" zusammen mit anderen Gruppen":"");
  }
}
function openGroupModal(gid){
  editingGroupId=gid||null;
  const g=gid?getGroup(gid):null;
  document.getElementById("groupModalTitle").textContent=g?"Gruppe bearbeiten":"Neue Gruppe";
  document.getElementById("groupNameInput").value=g?g.name:"";
  document.getElementById("groupError").textContent="";
  wdSel=g&&Array.isArray(g.days)?g.days.slice():[];
  renderWdPick();
  document.getElementById("groupModal").classList.add("open");
}
document.getElementById("saveGroupBtn").onclick=()=>{
  const err=document.getElementById("groupError");err.textContent="";
  const name=document.getElementById("groupNameInput").value.trim();
  if(!name){err.textContent="Bitte einen Namen eingeben.";return;}
  const days=wdSel.slice().sort((a,b)=>a-b);
  if(editingGroupId){const g=getGroup(editingGroupId);if(g){g.name=name;g.days=days;}}
  else state.groups.push({id:"g"+Date.now()+Math.random().toString(36).slice(2,5),name,days,surahs:[]});
  editingGroupId=null;save();closeModals();render();
};
document.getElementById("addGroupBtn").onclick=()=>openGroupModal(null);

// ---- Fokus-Modal ----
let focusSel=[],focusMode="until",focusWd=[],editingFocusId=null;
function renderFocusMulti(){
  const q=document.getElementById("focusSearch").value.trim().toLowerCase();
  const box=document.getElementById("focusMultiList");box.innerHTML="";
  SURAH_DB.forEach(s=>{
    const n=s[0],name=s[1],ar=s[2],ayat=s[4],place=s[5];
    if(q&&!(name.toLowerCase().includes(q)||ar.includes(q)||String(n)===q))return;
    const pos=focusSel.indexOf(n),on=pos>=0;
    const row=document.createElement("div");row.className="mitem"+(on?" on":"");
    row.innerHTML='<div class="mbox">'+CHECK_SVG+'</div>'+
      '<span class="mname">'+n+'. '+esc(name)+'<span class="msub">'+ayat+' Verse · '+placeLabel(place,true)+'</span></span>'+
      (on?'<span class="mord">'+(pos+1)+'</span>':'')+
      '<span class="mar">'+esc(ar)+'</span>';
    row.onclick=()=>{const i=focusSel.indexOf(n);if(i>=0)focusSel.splice(i,1);else focusSel.push(n);
      renderFocusMulti();updateFocusHint();};
    box.appendChild(row);
  });
  if(!box.children.length)box.innerHTML='<div style="padding:14px;text-align:center;color:var(--text-dim);font-size:13px;">Nichts gefunden</div>';
}
function renderFocusWd(){
  const box=document.getElementById("focusWdPick");box.innerHTML="";
  WD.forEach(w=>{
    const b=document.createElement("button");
    b.className=focusWd.includes(w.k)?"on":"";
    b.innerHTML='<span>'+w.kurz+'</span><span class="wpar">'+w.ar+'</span>';
    b.onclick=()=>{const i=focusWd.indexOf(w.k);if(i>=0)focusWd.splice(i,1);else focusWd.push(w.k);
      renderFocusWd();updateFocusHint();};
    box.appendChild(b);
  });
}
function updateFocusHint(){
  const h=document.getElementById("focusSelHint");
  if(!focusSel.length)h.textContent="Noch nichts ausgewählt.";
  else{
    const list=focusSel.map(surahByNum).filter(Boolean);
    h.textContent=list.length+" ausgewählt · "+list.reduce((s,x)=>s+x.ayat,0)+" Verse";
  }
  const fh=document.getElementById("focusHint");
  if(focusMode==="today")fh.textContent="Gilt nur für heute.";
  else if(focusMode==="until")fh.textContent="Läuft ab heute bis zum gewählten Datum.";
  else if(focusMode==="weekdays")fh.textContent=focusWd.length?("Erscheint jede Woche an: "+focusWd.slice().sort((a,b)=>a-b).map(k=>WD[k].de).join(", ")):"Bitte Wochentage wählen.";
  else fh.textContent="Läuft, bis du ihn löschst.";
}
function setFocusMode(m){
  focusMode=m;
  document.querySelectorAll("#focusModeSeg button").forEach(b=>b.classList.toggle("active",b.dataset.mode===m));
  document.getElementById("focusUntilField").style.display=(m==="until")?"":"none";
  document.getElementById("focusDaysField").style.display=(m==="weekdays")?"":"none";
  updateFocusHint();
}
function openFocusModal(fid){
  editingFocusId=fid||null;
  const f=fid?state.focus.find(x=>x.id===fid):null;
  document.getElementById("focusModalTitle").textContent=f?"Fokus bearbeiten":"Neuer Fokus";
  document.getElementById("saveFocusBtn").textContent=f?"Speichern":"Erstellen";
  document.getElementById("focusError").textContent="";
  document.getElementById("focusSearch").value="";
  document.getElementById("focusTitleInput").value=f?(f.title||""):"";
  focusSel=f?f.items.filter(x=>x.n).map(x=>x.n):[];
  focusWd=f&&Array.isArray(f.days)?f.days.slice():[];
  const def=addDays(new Date(),6);
  document.getElementById("focusUntilInput").value=(f&&f.date)?f.date:keyOf(def);
  setFocusMode(f?f.mode:"until");
  renderFocusMulti();renderFocusWd();updateFocusHint();
  document.getElementById("focusModal").classList.add("open");
}
document.querySelectorAll("#focusModeSeg button").forEach(b=>b.onclick=()=>setFocusMode(b.dataset.mode));
document.getElementById("focusSearch").addEventListener("input",renderFocusMulti);
document.getElementById("focusClearBtn").onclick=()=>{focusSel=[];renderFocusMulti();updateFocusHint();};
document.getElementById("addFocusBtn").onclick=()=>openFocusModal(null);
document.getElementById("focusAddTop").onclick=()=>openFocusModal(null);
document.getElementById("saveFocusBtn").onclick=()=>{
  const err=document.getElementById("focusError");err.textContent="";
  if(!focusSel.length){err.textContent="Bitte mindestens eine Surah auswählen.";return;}
  if(focusMode==="weekdays"&&!focusWd.length){err.textContent="Bitte Wochentage wählen.";return;}
  const until=document.getElementById("focusUntilInput").value;
  if(focusMode==="until"){
    if(!until){err.textContent="Bitte ein Enddatum wählen.";return;}
    if(until<todayKey()){err.textContent="Das Enddatum liegt in der Vergangenheit.";return;}
  }
  const items=focusSel.map(surahByNum).filter(Boolean)
    .map(s=>({n:s.n,name:s.name,ar:s.ar,p:s.p,vFrom:null,vTo:null}));
  const title=document.getElementById("focusTitleInput").value.trim();
  const date=focusMode==="today"?todayKey():(focusMode==="until"?until:null);
  if(editingFocusId){
    const f=state.focus.find(x=>x.id===editingFocusId);
    if(f){f.title=title;f.items=items;f.mode=focusMode;f.days=focusWd.slice().sort((a,b)=>a-b);f.date=date;}
  }else{
    state.focus.push({id:"f"+Date.now()+Math.random().toString(36).slice(2,5),
      title,items,mode:focusMode,days:focusWd.slice().sort((a,b)=>a-b),
      start:todayKey(),date});
  }
  editingFocusId=null;save();closeModals();render();
};

function closeModals(){
  document.querySelectorAll(".modal-bg").forEach(m=>m.classList.remove("open"));
  editingSurah=null;editingGroupId=null;editingFocusId=null;
}
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeModals);
document.querySelectorAll(".modal-bg").forEach(m=>m.onclick=e=>{if(e.target===m)closeModals();});

// ---- Custom confirm (statt confirm(), das in Web-Apps blockiert sein kann) ----
let confirmCb=null;
function askConfirm(text,cb,label){
  document.getElementById("confirmText").textContent=text;
  document.getElementById("confirmYes").textContent=label||"Löschen";
  confirmCb=cb;
  document.getElementById("confirmModal").classList.add("open");
}
document.getElementById("confirmYes").onclick=()=>{
  const cb=confirmCb;confirmCb=null;
  document.getElementById("confirmModal").classList.remove("open");
  if(cb)cb();
};

document.getElementById("calPrev").onclick=()=>{
  if(calMode==="month")calCursor=new Date(calCursor.getFullYear(),calCursor.getMonth()-1,1);
  else calCursor=addDays(startOfWeek(calCursor),-7);
  renderCalendar();
};
document.getElementById("calNext").onclick=()=>{
  if(calMode==="month")calCursor=new Date(calCursor.getFullYear(),calCursor.getMonth()+1,1);
  else calCursor=addDays(startOfWeek(calCursor),7);
  renderCalendar();
};
document.querySelectorAll(".cal-modes button").forEach(b=>b.onclick=()=>{calMode=b.dataset.mode;renderCalendar();});
document.getElementById("undoCustom").onclick=()=>{
  delete state.dayGroups[selKey()];save();render();
};
document.getElementById("jumpToday").onclick=()=>{selectedDate=new Date();calCursor=new Date();render();};
document.getElementById("missedMore").onclick=()=>{missedExpanded=!missedExpanded;renderMissed();};
// ---- Farbschema ----
const THEME_COLORS={gruen:"#0c1b18",violett:"#150f1f",blau:"#0b1622"};
function applyTheme(t){
  const th=THEME_COLORS[t]?t:"gruen";
  if(th==="gruen")document.body.removeAttribute("data-theme");
  else document.body.setAttribute("data-theme",th);
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta)meta.setAttribute("content",THEME_COLORS[th]);
  document.querySelectorAll("#themeRow button").forEach(b=>b.classList.toggle("active",b.dataset.theme===th));
  state.theme=th;
}
document.querySelectorAll("#themeRow button").forEach(b=>{
  b.onclick=()=>{applyTheme(b.dataset.theme);save();};
});

document.getElementById("resetBtn").onclick=()=>{
  askConfirm("Häkchen für diesen Tag zurücksetzen?",()=>{delete state.checks[selKey()];save();render();},"Zurücksetzen");
};

load();applyTheme(state.theme);render();
</script>
